<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HMF Admin</title><style>
:root{--g:#caa24a;--m:#a9adbb;--l:rgba(255,255,255,.14);--d:#ff6b6b;--o:#62d98b}*{box-sizing:border-box}body{margin:0;background:#0b0c10;color:#fff;font-family:Arial,sans-serif;padding:22px}.wrap{max-width:1250px;margin:auto}.top{display:flex;justify-content:space-between;margin-bottom:18px}.brand{font-size:24px;font-weight:900}a{color:var(--g);font-weight:900;text-decoration:none}.grid{display:grid;gap:16px}@media(min-width:1000px){.grid{grid-template-columns:560px 1fr}}.card{background:#12141c;border:1px solid var(--l);border-radius:20px;padding:18px}h1,h2{margin:0 0 12px}.help,.small{color:var(--m);font-size:13px;line-height:1.45}.row{display:grid;gap:8px;margin-bottom:13px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{font-size:13px;font-weight:900;color:#d7d9e3}input,textarea,select{width:100%;padding:12px;border-radius:12px;border:1px solid var(--l);background:#0d0f16;color:#fff}textarea{min-height:80px}.box{border:1px solid var(--l);border-radius:16px;padding:12px;background:rgba(255,255,255,.03);display:grid;gap:10px}.line{display:grid;grid-template-columns:1fr 1fr auto;gap:8px}.line2{display:grid;grid-template-columns:1fr auto;gap:8px}.chips,.actions{display:flex;gap:7px;flex-wrap:wrap}.chip,.pick.on{border-color:rgba(202,162,74,.85)!important;background:rgba(202,162,74,.18)!important}.chip{display:inline-flex;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--l);border-radius:999px}.chip button{width:18px;height:18px;border-radius:50%;border:0;background:rgba(255,255,255,.16);color:#fff}.pick{border:1px solid var(--l);border-radius:999px;padding:8px 10px;background:#0d0f16;color:#fff;font-weight:800}.pickgrid{display:flex;gap:7px;flex-wrap:wrap;max-height:155px;overflow:auto;border:1px solid var(--l);border-radius:14px;padding:10px}.btn,.primary,.ghost,.danger,.okbtn{border-radius:12px;padding:11px 14px;font-weight:900;cursor:pointer}.primary{border:0;background:var(--g);color:#111}.ghost{background:transparent;border:1px solid var(--l);color:#fff}.danger{background:transparent;border:1px solid rgba(255,107,107,.4);color:var(--d)}.okbtn{background:transparent;border:1px solid rgba(98,217,139,.4);color:var(--o)}.full{width:100%}.preview{min-height:190px;border:1px dashed var(--l);border-radius:16px;background:#050609;display:grid;place-items:center}.preview img{max-width:100%;max-height:310px;object-fit:contain}.list{display:grid;gap:12px}.item{display:grid;grid-template-columns:96px 1fr;gap:12px;border:1px solid var(--l);border-radius:16px;padding:12px}.thumb{width:96px;height:112px;background:#050609;border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden}.thumb img{max-width:100%;max-height:100%;object-fit:contain}.meta{color:var(--m);font-size:13px;line-height:1.45}.hide{display:none!important}@media(max-width:700px){.two,.line,.line2,.item{grid-template-columns:1fr}.thumb{width:100%;height:180px}}
</style></head><body><div class="wrap"><div class="top"><div><div class="brand">H Men's Fashion — Admin</div><div class="help">Add one style number with many color photos. Example: Beige → 2159-Beige.jpg, Olive → 2159-Olive.jpg.</div></div><a href="./index.html">Open Website</a></div><div class="grid"><section class="card"><h1 id="title">Add Product</h1><form id="form">
<div class="two"><div class="row"><label>Product Mode</label><select id="mode"><option value="outfit">Whole Outfit</option><option value="single">Single Item</option></select></div><div class="row"><label>Single Item Type</label><select id="itemType"><option value="">Not single item</option><option>Suit</option><option>Jacket</option><option>Dress Shirt</option><option>T-Shirt</option><option>Polo Shirt</option><option>Casual Shirt</option><option>Pants</option><option>Shoes</option><option>Tie</option><option>Belt</option><option>Accessories</option></select></div></div>
<div class="two"><div class="row"><label>Style Number</label><input id="style" placeholder="2159"></div><div class="row"><label>Price</label><input id="price" type="number" step="0.01" required placeholder="119.99"></div></div>
<div class="row"><label>Name</label><input id="name" required placeholder="2159 Linen Suit"></div><div class="row"><label>Description</label><textarea id="desc" required></textarea></div>
<div class="two"><div class="row"><label>Shirt Type</label><select id="shirtType"><option>Shirt</option><option>Dress Shirt</option><option>T-Shirt</option><option>Polo Shirt</option><option>Casual Shirt</option></select></div><div class="row"><label>Category</label><input id="cat" required placeholder="Suit / Pants / Complete Outfit"></div></div>
<div class="row"><label>Color Photos / Variants</label><div class="box"><div class="small">Add each color separately. Do not type two image names with +.</div><div class="line"><input id="vColor" placeholder="Beige"><input id="vImage" placeholder="2159-Beige.jpg"><button class="ghost" type="button" id="addV">Add Color Photo</button></div><div class="actions"><button class="ghost" type="button" id="previewV">Preview First Color</button><button class="danger" type="button" id="clearV">Clear Color Photos</button></div><div class="chips" id="vChips"></div><div class="preview" id="preview">Picture preview</div></div></div>
<div id="builders"></div><button class="primary full" type="submit" id="submit">Add Product</button><p class="help" id="msg"></p></form></section><section class="card"><h2>Current Products</h2><div class="actions" style="margin-bottom:12px"><button class="ghost" id="exportBtn">Export Backup</button><button class="danger" id="clearAll">Clear All</button></div><div id="list" class="list"></div></section></div></div><script>
const KEY='HMF_ADMIN_PRODUCTS';const SUIT=['34S','36S','36R','38S','38R','38L','40S','40R','40L','42S','42R','42L','44S','44R','44L','46S','46R','46L','48S','48R','48L','50R','50L','52R','52L','54R','54L','56R','56L','58R','58L','60R','60L','62R','62L','64R','64L','66R','66L'];const LET=['XS','S','M','L','XL','2XL','3XL','4XL','5XL','6XL'];const SHIRT=['14.5/32','15.5/32','15.5/34','16.5/32','16.5/34','16.5/36','17.5/32','17.5/34','17.5/36','18.5/32','18.5/34','18.5/36','19/32','19/34','19/36','20/32','20/34','20/36','21/32','21/34','21/36','22/32','22/34','22/36','23/32','23/34','23/36','24/32','24/34','24/36'];const PANTS=['28','30','32','34','36','38','40','42','44','46','48','50','52','54','56','58','60'];const SHOES=['7','7.5','8','8.5','9','9.5','10','10.5','11','11.5','12','13','14','15'];const BELT=['30','32','34','36','38','40','42','44','46','48','50','One Size'];const FIT=['Slim Fit','Modern Fit','Classic Fit','Regular Fit','Relaxed Fit','Skinny Fit','Athletic Fit','Big & Tall','One Size'];const DATA={suit:['Jacket / Suit Sizes',SUIT,LET],shirt:['Shirt Sizes',SHIRT,LET],pants:['Pants Sizes',PANTS,null],shoe:['Shoe Sizes',SHOES,null],belt:['Belt Sizes',BELT,null],fit:['Fit Type',FIT,null]};let products=JSON.parse(localStorage.getItem(KEY)||'[]'),edit=null,variants=[],state={suit:[],shirt:[],pants:[],shoe:[],belt:[],fit:[]};const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),money=n=>'$'+Number(n||0).toFixed(2),norm=s=>String(s||'').trim();function save(){localStorage.setItem(KEY,JSON.stringify(products))}function img(p){p=norm(p);if(!p)return'';if(p.startsWith('http')||p.startsWith('data:')||p.startsWith('./images/')||p.startsWith('images/'))return p.startsWith('images/')?'./'+p:p;return './images/'+p}function add(arr,v){String(v||'').split(',').map(x=>x.trim()).filter(Boolean).forEach(x=>{if(!arr.some(y=>y.toLowerCase()===x.toLowerCase()))arr.push(x)})}function toggle(arr,v){let i=arr.findIndex(x=>x.toLowerCase()===v.toLowerCase());i>=0?arr.splice(i,1):add(arr,v)}function makeBuilders(){let h='';for(const k in DATA){let [t,list,extra]=DATA[k];h+=`<div class="row"><label>${t}</label><div class="box"><div class="actions"><button class="ghost" type="button" id="all_${k}">Select All</button>${extra?`<button class="ghost" type="button" id="extra_${k}">Add XS-6XL</button>`:''}<button class="danger" type="button" id="clear_${k}">Clear</button></div><div class="line2"><input id="custom_${k}" placeholder="Type custom values, comma separated"><button class="ghost" type="button" id="add_${k}">Add Custom</button></div><div class="pickgrid" id="grid_${k}"></div><div class="chips" id="chips_${k}"></div></div></div>`}$('builders').innerHTML=h}function chips(arr,k){return arr.length?arr.map((v,i)=>`<span class="chip">${esc(v)} <button type="button" onclick="removeChip('${k}',${i})">×</button></span>`).join(''):'<span class="small">Nothing selected.</span>'}function removeChip(k,i){state[k].splice(i,1);render()}function render(){for(const k in DATA){let list=DATA[k][1];$('grid_'+k).innerHTML=list.map(v=>`<button class="pick ${state[k].some(x=>x.toLowerCase()===v.toLowerCase())?'on':''}" type="button" data-k="${k}" data-v="${esc(v)}">${esc(v)}</button>`).join('');$('chips_'+k).innerHTML=chips(state[k],k)}$('vChips').innerHTML=variants.length?variants.map((v,i)=>`<span class="chip">${esc(v.color)} → ${esc(v.image.replace('./images/',''))} <button type="button" onclick="removeV(${i})">×</button></span>`).join(''):'<span class="small">No color photos added.</span>'}function addV(){let color=norm($('vColor').value),image=img($('vImage').value);if(!color||!image){$('msg').textContent='Add color and image file name.';return}let i=variants.findIndex(v=>v.color.toLowerCase()===color.toLowerCase());if(i>=0)variants[i]={color,image};else variants.push({color,image});$('vColor').value='';$('vImage').value='';render();preview()}function removeV(i){variants.splice(i,1);render();preview()}function preview(){let p=variants[0]?.image;$('preview').innerHTML=p?`<img src="${esc(p)}" onerror="this.parentElement.innerHTML='<span class=bad>Image not found. Check images folder.</span>'">`:'Picture preview'}function parts(p){let a=[];if((p.suitSizes||[]).length)a.push('Jacket/Suit');if((p.shirtSizes||[]).length)a.push(p.shirtType||'Shirt');if((p.pantsSizes||[]).length)a.push('Pants');if((p.shoeSizes||[]).length)a.push('Shoes');if((p.beltSizes||[]).length)a.push('Belt');return a.join(' + ')||p.itemType||'Item'}function renderList(){if(!products.length){$('list').innerHTML='<div class="empty">No products yet.</div>';return}$('list').innerHTML=products.map(p=>`<div class="item"><div class="thumb"><img src="${esc(p.image||'')}"></div><div><b>${esc(p.name)}</b><div class="meta">${money(p.price)} • Style: ${esc(p.styleNumber||'')} • ${esc(p.productMode||'')}</div><div class="meta">${esc(p.description||'')}</div><div class="meta">Parts: ${esc(parts(p))}</div><div class="meta">Colors: ${(p.variants||[]).map(v=>esc(v.color)).join(', ')}</div><div class="actions"><button class="okbtn" onclick="editP('${p.id}')">Edit</button><button class="danger" onclick="delP('${p.id}')">Remove</button></div></div></div>`).join('')}function reset(){edit=null;variants=[];state={suit:[],shirt:[],pants:[],shoe:[],belt:[],fit:[]};$('form').reset();$('title').textContent='Add Product';$('submit').textContent='Add Product';$('preview').textContent='Picture preview';$('msg').textContent='';render()}function editP(id){let p=products.find(x=>x.id===id);if(!p)return;edit=id;variants=[...(p.variants||[])];state={suit:[...(p.suitSizes||[])],shirt:[...(p.shirtSizes||[])],pants:[...(p.pantsSizes||[])],shoe:[...(p.shoeSizes||[])],belt:[...(p.beltSizes||[])],fit:[...(p.fits||[])]};$('mode').value=p.productMode||'outfit';$('itemType').value=p.itemType||'';$('style').value=p.styleNumber||'';$('price').value=p.price||'';$('name').value=p.name||'';$('desc').value=p.description||'';$('shirtType').value=p.shirtType||'Shirt';$('cat').value=p.category||'';$('title').textContent='Edit Product';$('submit').textContent='Save Changes';render();preview();scrollTo({top:0,behavior:'smooth'})}function delP(id){if(!confirm('Remove this product?'))return;products=products.filter(p=>p.id!==id);save();renderList()}makeBuilders();render();renderList();document.addEventListener('click',e=>{let b=e.target.closest('.pick');if(b){toggle(state[b.dataset.k],b.dataset.v);render()}});for(const k in DATA){$('all_'+k).onclick=()=>{DATA[k][1].forEach(v=>add(state[k],v));render()};$('clear_'+k).onclick=()=>{state[k]=[];render()};$('add_'+k).onclick=()=>{add(state[k],$('custom_'+k).value);$('custom_'+k).value='';render()};if(DATA[k][2])$('extra_'+k).onclick=()=>{DATA[k][2].forEach(v=>add(state[k],v));render()}}$('addV').onclick=addV;$('previewV').onclick=preview;$('clearV').onclick=()=>{variants=[];render();preview()};$('mode').onchange=()=>{if($('mode').value==='outfit')$('itemType').value=''};$('itemType').onchange=()=>{if($('itemType').value)$('mode').value='single'};$('form').onsubmit=e=>{e.preventDefault();if(!variants.length){$('msg').textContent='Add at least one color photo.';return}if(!state.suit.length&&!state.shirt.length&&!state.pants.length&&!state.shoe.length&&!state.belt.length){$('msg').textContent='Select sizes/options for at least one product part.';return}let p={id:edit||('PRODUCT_'+Date.now()),productMode:$('mode').value,itemType:$('itemType').value,styleNumber:$('style').value.trim(),price:Number($('price').value||0),name:$('name').value.trim(),description:$('desc').value.trim(),shirtType:$('shirtType').value,category:$('cat').value.trim(),variants:[...variants],image:variants[0].image,colors:variants.map(v=>v.color),suitSizes:[...state.suit],shirtSizes:[...state.shirt],pantsSizes:[...state.pants],shoeSizes:[...state.shoe],beltSizes:[...state.belt],fits:[...state.fit]};edit?products=products.map(x=>x.id===edit?p:x):products.unshift(p);save();renderList();reset();$('msg').innerHTML='<span class="ok">Product saved.</span>'};$('clearAll').onclick=()=>{if(confirm('Clear all?')){products=[];save();renderList()}};$('exportBtn').onclick=()=>{let a=document.createElement('a'),blob=new Blob([JSON.stringify(products,null,2)],{type:'application/json'});a.href=URL.createObjectURL(blob);a.download='hmf-products-backup.json';a.click()}
</script></body></html>

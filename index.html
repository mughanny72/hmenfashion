<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>H Men's Fashion — Coming Soon</title>
<meta name="description" content="H Men's Fashion is putting the finishing touches on our online store. Check back soon."/>
<meta name="theme-color" content="#0b0c10"/>
<style>
  :root{ --gold:#d4af52; --gold2:#f0d27a; --bg:#0b0c10; --text:#fff; --muted:#c9c3b0; }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    font-family:Georgia,'Times New Roman',serif;
    background:radial-gradient(circle at 50% 30%, rgba(212,175,82,.14), transparent 55%), var(--bg);
    color:var(--text);
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:24px;
    text-align:center;
  }
  .wrap{ max-width:640px; }
  .logo{
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:24px;
  }
  .logo img{ width:220px; max-width:70vw; height:auto; display:block; }
  .rule{
    width:120px;
    height:1px;
    background:linear-gradient(90deg, transparent, var(--gold), transparent);
    margin:0 auto 34px;
  }
  h1{
    font-size:clamp(28px, 5vw, 42px);
    font-weight:400;
    margin:0 0 18px;
    letter-spacing:.02em;
    line-height:1.25;
  }
  p{
    color:var(--muted);
    font-size:17px;
    line-height:1.7;
    margin:0 0 8px;
    font-family:Arial,Helvetica,sans-serif;
  }
  .pill{
    display:inline-flex;
    align-items:center;
    gap:8px;
    margin-top:28px;
    padding:10px 20px;
    border:1px solid rgba(212,175,82,.4);
    border-radius:999px;
    background:rgba(212,175,82,.08);
    color:var(--gold2);
    font-family:Arial,Helvetica,sans-serif;
    font-size:13px;
    font-weight:700;
    letter-spacing:.08em;
    text-transform:uppercase;
  }
  .pill:before{
    content:"";
    width:7px;height:7px;border-radius:50%;
    background:var(--gold2);
    box-shadow:0 0 8px var(--gold2);
  }
  .addr{
    margin-top:38px;
    font-family:Arial,Helvetica,sans-serif;
    font-size:13px;
    color:rgba(201,195,176,.65);
    line-height:1.6;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo">
      <img src="./images/logo-hmf-gold.png" alt="H Men's Fashion" />
    </div>
    <div class="rule"></div>
    <h1>Something New Is Almost Ready</h1>
    <p>We're putting the finishing touches on our online store — checkout, shipping, and everything in between.</p>
    <p>Thank you for your patience. We'll be back online shortly.</p>
    <div class="pill">Launching Soon</div>
    <div class="addr">
      H Men's Fashion — Westmoreland Mall<br/>
      5256 US-30, Suite NL-04, Greensburg, PA 15601
    </div>
  </div>
</body>
</html>
